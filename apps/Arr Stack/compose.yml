services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: ${QBITTORRENT_WEBUI_PORT}
      TORRENTING_PORT: ${QBITTORRENT_TORRENT_PORT}
    volumes:
      - ${STACK_ROOT}/qbittorrent/config:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}"
      - "${QBITTORRENT_TORRENT_PORT}:${QBITTORRENT_TORRENT_PORT}"
      - "${QBITTORRENT_TORRENT_PORT}:${QBITTORRENT_TORRENT_PORT}/udp"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${STACK_ROOT}/sonarr/config:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${SONARR_PORT}:8989"
    restart: unless-stopped
    depends_on:
      - qbittorrent
      - prowlarr

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${STACK_ROOT}/radarr/config:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${RADARR_PORT}:7878"
    restart: unless-stopped
    depends_on:
      - qbittorrent
      - prowlarr

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${STACK_ROOT}/prowlarr/config:/config
    ports:
      - "${PROWLARR_PORT}:9696"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${STACK_ROOT}/bazarr/config:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${BAZARR_PORT}:6767"
    restart: unless-stopped
    depends_on:
      - sonarr
      - radarr

networks:
  default:
    name: arrstack_default