services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: ${QBITTORRENT_WEBUI_PORT}
      TORRENTING_PORT: ${QBITTORRENT_TORRENT_PORT}
    volumes:
      - ${STACK_ROOT}/qbittorrent/config:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${QBITTORRENT_WEBUI_PORT}:${QBITTORRENT_WEBUI_PORT}"
      - "${QBITTORRENT_TORRENT_PORT}:${QBITTORRENT_TORRENT_PORT}"
      - "${QBITTORRENT_TORRENT_PORT}:${QBITTORRENT_TORRENT_PORT}/udp"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${STACK_ROOT}/sonarr/config:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${SONARR_PORT}:8989"
    restart: unless-stopped
    depends_on:
      - qbittorrent
      - prowlarr

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${STACK_ROOT}/radarr/config:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${RADARR_PORT}:7878"
    restart: unless-stopped
    depends_on:
      - qbittorrent
      - prowlarr

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${STACK_ROOT}/prowlarr/config:/config
    ports:
      - "${PROWLARR_PORT}:9696"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${STACK_ROOT}/bazarr/config:/config
      - ${DATA_ROOT}:/data
    ports:
      - "${BAZARR_PORT}:6767"
    restart: unless-stopped
    depends_on:
      - sonarr
      - radarr
  
  flaresolverr:
      image: ghcr.io/flaresolverr/flaresolverr:latest
      container_name: flaresolverr
      environment:
        LOG_LEVEL: ${FLARESOLVERR_LOG_LEVEL}
        LOG_HTML: ${FLARESOLVERR_LOG_HTML}
        CAPTCHA_SOLVER: none
        TZ: ${TZ}
        LANG: ${FLARESOLVERR_LANG}
        HEADLESS: ${FLARESOLVERR_HEADLESS}
        PORT: 8191
        HOST: 0.0.0.0
        BROWSER_TIMEOUT: ${FLARESOLVERR_BROWSER_TIMEOUT}
        TEST_URL: ${FLARESOLVERR_TEST_URL}
      ports:
        - "${FLARESOLVERR_PORT}:8191"
      restart: unless-stopped

  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      RECYCLARR_CONFIG_DIR: /config
      RECYCLARR_DATA_DIR: /data
    volumes:
      - ${STACK_ROOT}/recyclarr/config:/config
      - ${STACK_ROOT}/recyclarr/data:/data
    restart: unless-stopped
    depends_on:
        - sonarr
        - radarr

networks:
  default:
    name: arrstack_default