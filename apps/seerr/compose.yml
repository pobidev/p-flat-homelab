services:
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    user: ${PUID}:${PGID}

    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
      - PORT=${SEERR_PORT}

    ports:
      - ${SEERR_PORT}:${SEERR_PORT}

    volumes:
      - ${STACK_ROOT}/config:/app/config

    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:${SEERR_PORT}/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3

    security_opt:
      - no-new-privileges

    cap_drop:
      - ALL

    restart: unless-stopped

networks:
  default:
    name: arrstack_default